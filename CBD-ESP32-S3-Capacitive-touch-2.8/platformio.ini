; ═══════════════════════════════════════════════════════════════════════════
; WontHound / HaleHound — ESP32-S3 ES3C28P/ES3N28P 2.8"
; Standalone single-target project (split out from the shared source tree)
;
; Board: ESP32-S3 2.8" IPS ILI9341V + FT6336 capacitive touch, 16MB QIO flash.
;   LCD:   CS=10 DC=46 BL=45 SCK=12 MOSI=11 MISO=13
;   Touch: FT6336 I2C SCL=15 SDA=16 INT=17 RST=18
;   NRF24: P3 SPI pins + P2 UART GPIO43/44 for CE/IRQ
; Native USB-CDC (no CH340) — board enumerates as a COM port over USB.
; ═══════════════════════════════════════════════════════════════════════════

[platformio]
src_dir = .

[env:esp32-s3-es3c28p]
platform = espressif32@6.9.0
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
platform_packages =
    tool-esptoolpy@2.40900.250804
monitor_speed = 115200
upload_speed = 460800

; Set this to your board's COM port (shows up after USB connect):
upload_port = COM10
upload_flags =
    --before=usb_reset

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DUSER_SETUP_LOADED
    -include User_Setup.h
    -Wl,--allow-multiple-definition
    -DFAILURE_HANDLING
    -DESP32S3_ES3C28P=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DNRF24_BOOT_CHECK_OPTIONAL=1

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.0.0
    mikalhart/TinyGPSPlus@^1.0.3
    plerup/EspSoftwareSerial@^8.2.0
    sui77/rc-switch@^2.6.4
    kosme/arduinoFFT@^2.0.2
    nrf24/RF24@1.4.11
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    lsatan/SmartRC-CC1101-Driver-Lib@^2.5.7
    adafruit/Adafruit PN532@^1.3.3

board_build.partitions = huge_app.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
monitor_filters = esp32_exception_decoder
