; ═══════════════════════════════════════════════════════════════════════════
; WontHound / HaleHound — CYD ESP32 "3E" (classic ESP32-2432S028, SPI exposed)
; Standalone single-target project (split out from the shared source tree)
;
; Board: ESP32-2432S028 "Cheap Yellow Display" 2.8" 240x320 ILI9341,
;        XPT2046 resistive touch. SPI/serial header exposed for NRF24 + GPS.
; Default target = no board flag => CYD_28 pin map (see cyd_config.h).
; Radios: NRF24 on the exposed SPI header; GPS on UART.
; ═══════════════════════════════════════════════════════════════════════════

[platformio]
src_dir = .

[env:esp32-cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; Auto-detect the serial port. To pin it, uncomment and set your COM port:
; upload_port = COM3

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM=0
    ; TFT_eSPI uses our custom User_Setup.h in project folder
    -DUSER_SETUP_LOADED
    -include User_Setup.h
    ; Allow override of SDK functions (deauth) and resolve SPI conflicts
    -Wl,--allow-multiple-definition
    ; RF24 library: enable 95ms timeout in write()/writeFast() to prevent infinite loops
    -DFAILURE_HANDLING
    ; This board is the Freenove ESP32-32E (2.8") with the E01/NRF24 on the P3/P4
    ; SPI breakout + botch wire IO16->P4 pin3. Selects NRF24 CSN=27, CE=16, IRQ=35
    ; (display/touch stay CYD_28: ILI9341 + XPT2046, backlight GPIO21 — unchanged).
    -DFREENOVE_E32R28T_P3_NRF24=1

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.0.0
    mikalhart/TinyGPSPlus@^1.0.3
    plerup/EspSoftwareSerial@^8.2.0
    sui77/rc-switch@^2.6.4
    kosme/arduinoFFT@^2.0.2
    nrf24/RF24@1.4.11
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    lsatan/SmartRC-CC1101-Driver-Lib@^2.5.7
    adafruit/Adafruit PN532@^1.3.3

board_build.partitions = huge_app.csv
board_build.flash_mode = dio
board_build.f_flash = 40000000L
monitor_filters = esp32_exception_decoder
