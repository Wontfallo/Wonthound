[platformio]
src_dir = .
boards_dir = boards
lib_dir = lib
; Isolated PlatformIO core for this board. The C5 needs the pioarduino platform +
; Arduino-ESP32 3.3.8, which conflicts with the S3/3E (espressif32@6.9.0 / Arduino
; 2.x) in the shared global store. A project-local core means the C5 and the other
; boards never clobber each other's framework — build any of them in any order.
; (Downloads its own toolchain here on first build; gitignored.)
core_dir = ${PROJECT_DIR}/.pio-core

[env:nm-cyd-c5]
; pioarduino 55.03.38 bundles Arduino-ESP32 3.3.8 and ESP32-C5 support.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = nm_cyd_c5
framework = arduino
board_build.partitions = boards/nm_cyd_c5_partitions.csv
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = dio_qspi
board_upload.flash_size = 16MB
upload_speed = 115200
monitor_speed = 115200

platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.8/esp32-core-3.3.8.zip
    framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.8/esp32-core-3.3.8-libs.tar.xz

extra_scripts =
    pre:scripts/patch_tft_espi_c5.py

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DUSER_SETUP_LOADED
    -include User_Setup.h
    -Wl,--allow-multiple-definition
    -DFAILURE_HANDLING
    -DESP32C5_NM_CYD=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DNRF24_BOOT_CHECK_OPTIONAL=1

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.0.0
    mikalhart/TinyGPSPlus@^1.0.3
    plerup/EspSoftwareSerial@^8.2.0
    sui77/rc-switch@^2.6.4
    kosme/arduinoFFT@^2.0.2
    nrf24/RF24@1.4.11
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    lsatan/SmartRC-CC1101-Driver-Lib@^2.5.7
    adafruit/Adafruit PN532@^1.3.3

build_src_filter =
    +<*.ino>
    +<*.cpp>
    +<*.h>
    -<boards/>
    -<docs/>
    -<flash/>
    -<logs/>
    -<reference-firmwares/>
    -<rockbase-ref/>
    -<scripts/>
    -<split-icons/>
    -<tools/>

monitor_filters = esp32_exception_decoder
